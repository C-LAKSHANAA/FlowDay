<div class="task-editor" (click)="$event.stopPropagation()">

  <div class="editor-header">
    <strong>{{ editTask ? 'Edit Task' : 'New Task' }}</strong>
    <span class="editor-day">{{ dayDate }}</span>
    <button class="editor-close" (click)="cancel.emit()" aria-label="Close">✕</button>
  </div>

  <!-- ── Natural-language parse ───────────────────── -->
  <div class="parse-section">
    <label class="parse-label">Describe your task</label>
    <div class="parse-row">
      <input
        class="parse-input"
        type="text"
        [(ngModel)]="parseText"
        placeholder="e.g. call mom urgent today, 15 min"
        (keydown.enter)="parseDescription()"
        autocomplete="off"
      />
      <button
        class="btn-parse"
        (click)="parseDescription()"
        [disabled]="parsing || !parseText.trim()"
        title="Parse description into fields"
      >{{ parsing ? '…' : '→' }}</button>
    </div>
    <p class="parse-hint">Press → to auto-fill the form below from your description.</p>
    <p class="parse-error" *ngIf="parseError">{{ parseError }}</p>
  </div>

  <div class="divider" aria-hidden="true"></div>

  <!-- ── Structured fields ────────────────────────── -->
  <div class="field-row">
    <label>Title</label>
    <input type="text" [(ngModel)]="title" placeholder="Task title" autocomplete="off" />
  </div>

  <div class="field-row">
    <label>Category</label>
    <input type="text" [(ngModel)]="category"
           placeholder="e.g. reading, exercise"
           (ngModelChange)="onCategoryOrDurationChange()" />
  </div>

  <div class="field-row">
    <label>Duration <span class="unit">(min)</span></label>
    <input type="number" [(ngModel)]="duration" min="1" max="480"
           (ngModelChange)="onCategoryOrDurationChange()" />
  </div>

  <!-- Duration suggestion chip -->
  <div class="suggestion-chip" *ngIf="showSuggestion" role="status">
    <span class="suggestion-icon">💡</span>
    <span class="suggestion-text">{{ prediction!.message }}</span>
    <button class="btn-accept" (click)="acceptSuggestion()">Use {{ prediction!.predicted_duration }} min</button>
    <button class="btn-dismiss-suggestion" (click)="dismissSuggestion()" aria-label="Dismiss suggestion">✕</button>
  </div>
  <div class="suggestion-loading" *ngIf="predicting">
    <span>Checking past data…</span>
  </div>

  <div class="field-row">
    <label>Priority <span class="unit">(1–10)</span></label>
    <input type="number" [(ngModel)]="priority" min="1" max="10" />
  </div>

  <div class="field-row">
    <label>Depends on</label>
    <select [(ngModel)]="dependsOn">
      <option value="">— none —</option>
      <option *ngFor="let t of eligibleDependencies" [value]="t.id">{{ t.title }}</option>
    </select>
  </div>

  <details class="constraints-section">
    <summary>Optional constraints</summary>
    <div class="field-row">
      <label>Deadline</label>
      <input type="time" [(ngModel)]="deadlineInput" step="300" />
    </div>
    <div class="field-row">
      <label>Earliest start</label>
      <input type="time" [(ngModel)]="earliestStartInput" step="300" />
    </div>
    <div class="field-row">
      <label>Latest end</label>
      <input type="time" [(ngModel)]="latestEndInput" step="300" />
    </div>
  </details>

  <div class="editor-actions">
    <button class="btn-save" (click)="submit()" [disabled]="!title.trim() || duration <= 0">
      {{ editTask ? 'Save changes' : 'Add task' }}
    </button>
    <button class="btn-cancel" (click)="cancel.emit()">Cancel</button>
  </div>

</div>
