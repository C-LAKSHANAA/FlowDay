name: Deploy to GitHub Pages

on:
  push:
    branches: [main]   # Deploy on every push to main
  workflow_dispatch:   # Also allows manual trigger from the Actions tab

# Sets permissions so the workflow can write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Job 1: Build the Angular app ─────────────────────────────────────
  build:
    name: Build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build with --base-href set to the GitHub Pages sub-path.
      # GitHub Pages serves your repo at:
      #   https://<your-username>.github.io/<your-repo-name>/
      # The base-href must match the repo name exactly (case-sensitive).
      # Replace "FlowDay" below if your GitHub repo name is different.
      - name: Build for GitHub Pages
        run: |
          npx ng build --configuration production \
            --base-href "/FlowDay/"

      # GitHub Pages requires a .nojekyll file so it doesn't try to
      # process the Angular output as a Jekyll site.
      - name: Add .nojekyll
        run: touch dist/flowday/.nojekyll

      # Angular's router uses HTML5 pushState — GitHub Pages returns 404
      # on deep links. Copy index.html to 404.html so any URL resolves
      # to the Angular app and the router takes over.
      - name: Add 404.html for deep-link support
        run: cp dist/flowday/index.html dist/flowday/404.html

      # Upload the built output as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/flowday

  # ── Job 2: Deploy to GitHub Pages ────────────────────────────────────
  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}   # The live URL is printed here

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
