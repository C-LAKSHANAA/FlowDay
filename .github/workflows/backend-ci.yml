name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Import check (all app modules)
        run: python -c "
          from app.models import DaySchedule, WeekSchedule;
          from app.solver import solve_schedule, solve_week;
          from app.fixtures import get_dummy_schedule, get_dummy_week_schedule;
          from app.validation import validate_day_schedule;
          from app.persistence import read_all_completions;
          from app.duration_model import predict_duration;
          from app.task_parser import parse_task_text;
          from app.main import app;
          print('All imports OK')
        "
